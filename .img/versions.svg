<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <g font-size="14" fill="#1f2933">
    <!-- 1 -->
    <rect x="20" y="20" width="275" height="360" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="157" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">philo_concurrency</text>
    <text x="157" y="74" text-anchor="middle" fill="#1e40af">mandatory · threads + mutexes</text>
    <g transform="translate(157,165)">
      <circle r="62" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
      <g fill="#2563eb"><circle cx="0" cy="-62" r="13"/><circle cx="59" cy="-19" r="13"/><circle cx="36" cy="50" r="13"/><circle cx="-36" cy="50" r="13"/><circle cx="-59" cy="-19" r="13"/></g>
      <g fill="#d97706"><rect x="27" y="-50" width="12" height="12" rx="2"/><rect x="40" y="18" width="12" height="12" rx="2"/><rect x="-6" y="48" width="12" height="12" rx="2"/><rect x="-52" y="18" width="12" height="12" rx="2"/><rect x="-39" y="-50" width="12" height="12" rx="2"/></g>
      <text y="5" text-anchor="middle" font-size="13" fill="#1e3a8a">monitor</text>
    </g>
    <text x="40" y="270">• 1 thread per philosopher</text>
    <text x="40" y="294">• 1 mutex per fork (orange)</text>
    <text x="40" y="318">• odd / even pick forks in</text>
    <text x="52" y="338">opposite order</text>
    <text x="40" y="362">• 1 monitor thread checks deaths</text>

    <!-- 2 -->
    <rect x="312" y="20" width="275" height="360" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="449" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#4c1d95">philo_monitor</text>
    <text x="449" y="74" text-anchor="middle" fill="#5b21b6">alternative · a "waiter" table</text>
    <rect x="379" y="110" width="140" height="64" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="449" y="132" text-anchor="middle" font-size="13" fill="#4c1d95">forks_available[ ]</text>
    <g><rect x="397" y="144" width="18" height="18" rx="3" fill="#22c55e"/><rect x="419" y="144" width="18" height="18" rx="3" fill="#22c55e"/><rect x="441" y="144" width="18" height="18" rx="3" fill="#ef4444"/><rect x="463" y="144" width="18" height="18" rx="3" fill="#ef4444"/><rect x="485" y="144" width="18" height="18" rx="3" fill="#22c55e"/></g>
    <g stroke="#7c3aed" stroke-width="2"><line x1="385" y1="215" x2="420" y2="178"/><line x1="449" y1="215" x2="449" y2="178"/><line x1="513" y1="215" x2="478" y2="178"/></g>
    <g fill="#2563eb"><circle cx="385" cy="226" r="13"/><circle cx="449" cy="226" r="13"/><circle cx="513" cy="226" r="13"/></g>
    <text x="332" y="270">• forks are flags: free / taken</text>
    <text x="332" y="294">• "are BOTH my forks free?"</text>
    <text x="344" y="314">yes → take both at once</text>
    <text x="344" y="334">no → wait 1-10 ms and retry</text>
    <text x="332" y="358">• hungrier = retries sooner</text>

    <!-- 3 -->
    <rect x="604" y="20" width="275" height="360" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="741" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">philo_semaphores</text>
    <text x="741" y="74" text-anchor="middle" fill="#166534">bonus · processes + semaphores</text>
    <rect x="651" y="104" width="180" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text x="726" y="128" text-anchor="end" font-size="13" fill="#14532d">/forks = N</text><g fill="#d97706"><rect x="734" y="117" width="12" height="12" rx="2"/><rect x="749" y="117" width="12" height="12" rx="2"/><rect x="764" y="117" width="12" height="12" rx="2"/><rect x="779" y="117" width="12" height="12" rx="2"/><rect x="794" y="117" width="12" height="12" rx="2"/></g>
    <text x="741" y="150" text-anchor="middle" font-size="13" fill="#14532d">/waiter = N/2 seats</text>
    <text x="741" y="168" text-anchor="middle" font-size="12" fill="#166534">(shared by all processes)</text>
    <g stroke="#16a34a" stroke-width="2"><line x1="677" y1="215" x2="712" y2="178"/><line x1="741" y1="215" x2="741" y2="178"/><line x1="805" y1="215" x2="770" y2="178"/></g>
    <g fill="#2563eb"><rect x="664" y="214" width="26" height="24" rx="5"/><rect x="728" y="214" width="26" height="24" rx="5"/><rect x="792" y="214" width="26" height="24" rx="5"/></g>
    <text x="624" y="270">• 1 process per philosopher</text>
    <text x="624" y="294">• forks in the middle of the table</text>
    <text x="624" y="318">• each process has its own</text>
    <text x="636" y="338">monitor thread</text>
    <text x="624" y="362">• parent kills all when one dies</text>
  </g>
</svg>
