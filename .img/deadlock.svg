<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="760" height="390" rx="16" fill="#ffffff"/>
  <line x1="380" y1="30" x2="380" y2="360" stroke="#e2e8f0" stroke-width="2"/>

  <!-- left: deadlock -->
  <text x="190" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">Everyone takes the same side first</text>
  <g stroke="#dc2626" stroke-width="3" marker-end="url(#r)" fill="none">
    <path d="M222,104 Q290,110 286,180"/>
    <path d="M286,222 Q290,290 222,296"/>
    <path d="M158,296 Q90,290 94,222"/>
    <path d="M94,180 Q90,110 158,104"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="190" cy="100" r="30" fill="#2563eb"/><text x="190" y="107">1</text>
    <circle cx="290" cy="200" r="30" fill="#2563eb"/><text x="290" y="207">2</text>
    <circle cx="190" cy="300" r="30" fill="#2563eb"/><text x="190" y="307">3</text>
    <circle cx="90" cy="200" r="30" fill="#2563eb"/><text x="90" y="207">4</text>
  </g>
  <text x="190" y="196" text-anchor="middle" font-size="14" fill="#7f1d1d">each holds 1 fork</text>
  <text x="190" y="214" text-anchor="middle" font-size="14" fill="#7f1d1d">and waits for the next</text>
  <text x="190" y="362" text-anchor="middle" font-size="15" fill="#1f2933">A closed circle of waits: nobody ever eats.</text>

  <!-- right: fixed -->
  <text x="570" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#15803d">Even philosophers start on the other side</text>
  <g stroke="#16a34a" stroke-width="3" marker-end="url(#g)" fill="none">
    <path d="M602,104 Q670,110 666,180"/>
    <path d="M538,296 Q470,290 474,222"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" fill="none">
    <path d="M666,222 Q670,290 602,296"/>
    <path d="M474,180 Q470,110 538,104"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="570" cy="100" r="30" fill="#2563eb"/><text x="570" y="107">1</text>
    <circle cx="670" cy="200" r="30" fill="#2563eb"/><text x="670" y="207">2</text>
    <circle cx="570" cy="300" r="30" fill="#2563eb"/><text x="570" y="307">3</text>
    <circle cx="470" cy="200" r="30" fill="#2563eb"/><text x="470" y="207">4</text>
  </g>
  <text x="570" y="196" text-anchor="middle" font-size="14" fill="#14532d">neighbors fight for the</text>
  <text x="570" y="214" text-anchor="middle" font-size="14" fill="#14532d">same FIRST fork</text>
  <text x="570" y="362" text-anchor="middle" font-size="15" fill="#1f2933">The loser holds nothing, so the circle breaks.</text>
</svg>
